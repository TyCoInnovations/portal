<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TyCo Bookmarks</title>
  <link rel="icon" type="image/png" sizes="1920x1920" href="images/favicon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ── */
    :root {
      --green:   #3ecf74;
      --blue:    #3b82f6;
      --bg:      #0d0f14;
      --surface: #141720;
      --s2:      #1c2030;
      --border:  rgba(255,255,255,0.07);
      --text:    #e8eaf0;
      --muted:   #6b7385;
      --r:       16px;
      --f:       'Outfit', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--f);
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      grid-template-rows: 49px 1fr;
    }

    /* ambient glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 8% 15%,  rgba(62,207,116,0.055) 0%, transparent 55%),
        radial-gradient(ellipse 45% 55% at 92% 85%, rgba(59,130,246,0.055) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(13,15,20,0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      height: 49px;
    }

    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      background: linear-gradient(110deg, var(--green), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }

    /* centred greeting */
    #header-greeting {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      text-align: center;
      white-space: nowrap;
    }

    #header-greeting span {
      background: linear-gradient(110deg, var(--green), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 600;
    }

    /* clock/buttons sit right-aligned */
    .header-right {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }

    #clock {
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.2px;
    }

    /* ── Main grid ── */
    main {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 300px;
      grid-template-rows: 1fr 220px;
      gap: 12px;
      padding: 12px 14px 12px;
      height: calc(100vh - 49px);
      overflow: hidden;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 16px;
      overflow: hidden;
      animation: fadeUp 0.35s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      user-select: none;
    }

    /* ── Bookmarks card ── */
    #bookmarks-card {
      grid-column: 1;
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      animation-delay: 0.04s;
    }

    .bm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 7px;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      align-content: start;
      padding-right: 2px;
      /* extra bottom padding so last row isn't clipped */
      padding-bottom: 6px;
    }

    .bm-grid::-webkit-scrollbar { width: 3px; }
    .bm-grid::-webkit-scrollbar-track { background: transparent; }
    .bm-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.09); border-radius: 3px; }

    .bookmark {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 5px;
      border-radius: 11px;
      text-decoration: none;
      color: var(--text);
      background: var(--s2);
      border: 1px solid var(--border);
      transition: background 0.18s, border-color 0.18s, transform 0.14s;
      cursor: pointer;
      /* prevent text selection on click */
      user-select: none;
      -webkit-user-select: none;
    }
    .bookmark.style-rounded { border-radius: 14px; }
    .bookmark.style-square { border-radius: 2px; }
    .bookmark.style-tab {
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 10px;
      gap: 8px;
      border-radius: 9px 9px 0 0;
      min-height: 44px;
    }
    .bookmark.style-tab .bm-label {
      text-align: left;
      white-space: nowrap;
      max-width: none;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      overflow: hidden;
      text-overflow: ellipsis;
    .bookmark.style-square { border-radius: 6px; }
    .bookmark.style-tab {
      border-radius: 10px 10px 5px 5px;
      clip-path: polygon(0 10%, 20% 10%, 26% 0, 100% 0, 100% 100%, 0 100%);
      padding-top: 12px;
    }
    .bookmark.style-pill { border-radius: 999px; }

    .bookmark:hover {
      background: rgba(62,207,116,0.07);
      border-color: rgba(62,207,116,0.22);
      transform: translateY(-2px);
    }

    /* favicon wrapper */
    .bm-icon {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bm-icon img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    .bm-fallback {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1;
      user-select: none;
    }

    .bookmark .bm-label {
      font-size: 0.62rem;
      font-weight: 500;
      text-align: center;
      color: var(--muted);
      line-height: 1.2;
      max-width: 68px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.14s;
    }

    .bookmark:hover .bm-label { color: var(--text); }

    .tile-action {
      position: absolute;
      top: -5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #334155;
      border: 2px solid var(--bg);
      color: #fff;
      font-size: 9px;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s;
    }

    .tile-delete { right: -5px; background: #ef4444; }
    .tile-edit { right: 15px; background: #3b82f6; }
    .tile-move { right: 35px; background: #64748b; }
    .bookmark .tile-action { pointer-events: none; }
    .bookmark.edit-mode .tile-action { display: flex; pointer-events: auto; }
    .bookmark:hover .tile-action,
    .bookmark.edit-mode .tile-action { display: flex; }
    .tile-delete:hover { background: #dc2626; }
    .tile-edit:hover { background: #2563eb; }
    .tile-move:hover { background: #475569; }
    .bookmark.edit-mode { animation: wiggle 0.2s ease-in-out infinite alternate; }
    .bookmark.drag-ready {
      outline: 2px dashed rgba(59,130,246,0.75);
      animation: none;
      cursor: grab;
    }
    .bookmark.dragging {
      opacity: 0.45;
      transform: scale(0.97);
      animation: none;
    }
    @keyframes wiggle {
      from { transform: rotate(-1deg); }
      to   { transform: rotate(1deg); }
    }

    /* add tile */
    .add-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 5px;
      border-radius: 11px;
      background: transparent;
      border: 1px dashed rgba(62,207,116,0.22);
      color: var(--green);
      font-size: 0.62rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
      font-family: var(--f);
      user-select: none;
    }

    .add-tile:hover {
      background: rgba(62,207,116,0.06);
      border-color: rgba(62,207,116,0.42);
    }

    .add-tile .plus {
      font-size: 1.15rem;
      line-height: 1;
      font-weight: 300;
    }

    /* ── Search card ── */
    #search-card {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      animation-delay: 0.09s;
    }

    .search-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .search-ico {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      pointer-events: none;
      line-height: 1;
    }

    #search-input {
      width: 100%;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--f);
      font-size: 0.82rem;
      padding: 9px 11px 9px 32px;
      outline: none;
      transition: border-color 0.18s;
    }

    #search-input:focus { border-color: rgba(62,207,116,0.32); }
    #search-input::placeholder { color: var(--muted); }

    .stags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
      flex-shrink: 0;
    }

    .stag {
      font-size: 0.65rem;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      font-family: var(--f);
      user-select: none;
    }

    .stag:hover {
      background: rgba(62,207,116,0.08);
      border-color: rgba(62,207,116,0.26);
      color: var(--green);
    }

    #suggestions {
      margin-top: 6px;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: none;
      flex-shrink: 0;
    }

    .sug-item {
      padding: 7px 11px;
      font-size: 0.76rem;
      cursor: pointer;
      color: var(--muted);
      background: var(--s2);
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background 0.14s, color 0.14s;
      user-select: none;
    }

    .sug-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }

    /* ── Widgets card ── */
    #widgets-card {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation-delay: 0.14s;
      /* fixed height = 220px via grid row */
    }

    .wbox {
      border-radius: 10px;
      overflow: hidden;
      background: #080a0e;
      border: 1px solid var(--border);
      position: relative;
      flex-shrink: 0;
    }

    /* Weather: compact fixed height */
    #wbox-weather {
      height: 88px;
    }

    #wbox-weather .tomorrow {
      width: 100%;
      height: 100%;
    }

    /* Stocks: fills remaining space */
    #wbox-stocks {
      flex: 1;
      min-height: 0;
    }

    #wbox-stocks .tv-wrap,
    #wbox-stocks .tv-wrap > div {
      width: 100%;
      height: 100%;
    }

    /* ── Modals shared base ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 24px;
      width: 340px;
      max-width: 92vw;
      animation: fadeUp 0.2s ease;
    }

    .modal-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 0.98rem;
      font-weight: 700;
      background: linear-gradient(110deg, var(--green), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .modal-x {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
      font-family: var(--f);
    }

    .modal-x:hover { color: var(--text); }

    .modal-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .mfield {
      width: 100%;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--f);
      font-size: 0.84rem;
      padding: 10px 12px;
      outline: none;
      margin-bottom: 8px;
      transition: border-color 0.18s;
    }

    .mfield:focus { border-color: rgba(62,207,116,0.32); }
    .mfield::placeholder { color: var(--muted); }

    .mbtn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(110deg, var(--green), var(--blue));
      color: #0d0f14;
      font-family: var(--f);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 2px;
      transition: opacity 0.18s, transform 0.14s;
    }

    .mbtn:hover { opacity: 0.88; transform: translateY(-1px); }
    .mbtn:active { transform: translateY(0); opacity: 1; }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.76rem;
      color: var(--muted);
    }
    .settings-row select, .settings-row input { max-width: 170px; }
    .icon-btn {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 5px 8px;
      cursor: pointer;
      font-family: var(--f);
      font-size: 0.7rem;
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="logo">TyCo Bookmarks</div>
    <div id="header-greeting">Good morning, <span id="uname-display">there</span></div>
    <div class="header-right">
      <button class="icon-btn" id="toggle-edit">Edit</button>
      <select id="profile-switch" class="icon-btn" style="max-width:140px;"></select>
      <button class="icon-btn" id="new-profile">+ Profile</button>
    <div class="logo">TyCo Bookmarks 2.0</div>
    <div id="header-greeting">Good morning, <span id="uname-display">there</span></div>
    <div class="header-right">
      <button class="icon-btn" id="toggle-edit">Edit</button>
      <button class="icon-btn" id="open-settings">Settings</button>
      <span id="clock">00:00:00</span>
    </div>
  </header>

  <!-- ── Main ── -->
  <main>

    <!-- Bookmarks -->
    <div class="card" id="bookmarks-card">
      <div class="card-label">Bookmarks</div>
      <div class="bm-grid" id="bm-grid">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Search -->
    <div class="card" id="search-card">
      <div class="card-label">Search</div>
      <div class="search-wrap">
        <span class="search-ico">🔍</span>
        <input id="search-input" type="text" placeholder="Search with StartPage…" autocomplete="off" spellcheck="false">
      </div>
      <div class="stags">
        <button class="stag" data-q="weather forecast">Weather</button>
        <button class="stag" data-q="news today">News</button>
        <button class="stag" data-q="trending topics">Trending</button>
        <button class="stag" data-q="local events near me">Events</button>
        <button class="stag" data-q="tech news">Tech</button>
        <button class="stag" data-q="entertainment news">Entertainment</button>
      </div>
      <div id="suggestions" role="listbox" aria-label="Search suggestions"></div>
    </div>

    <!-- Widgets -->
    <div class="card" id="widgets-card">
      <div class="card-label">Widgets</div>

      <!-- Weather -->
      <div class="wbox" id="wbox-weather">
        <script>
          (function(d,s,id){
            if (d.getElementById(id)) {
              if (window.__TOMORROW__) window.__TOMORROW__.renderWidget();
              return;
            }
            var js = d.createElement(s);
            js.id = id;
            js.src = 'https://www.tomorrow.io/v1/widget/sdk/sdk.bundle.min.js';
            d.head.appendChild(js);
          })(document, 'script', 'tomorrow-sdk');
        </script>
        <div class="tomorrow"
          data-location-id=""
          data-language="EN"
          data-unit-system="METRIC"
          data-skin="dark"
          data-widget-type="upcoming"
          style="padding-bottom:14px; position:relative; height:100%; width:100%;">
          <a href="https://weather.tomorrow.io/" rel="noopener noreferrer" target="_blank"
             style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);">
            <img alt="Powered by Tomorrow.io"
                 src="https://weather-website-client.tomorrow.io/img/powered-by.svg"
                 width="130" height="11" loading="lazy">
          </a>
        </div>
      </div>

      <!-- Stocks (TradingView) -->
      <div class="wbox" id="wbox-stocks">
        <div class="tv-wrap">
          <div class="tradingview-widget-container" style="height:100%;width:100%;">
            <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
            <script type="text/javascript"
              src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js"
              async>
            {
              "symbols": [
                ["Apple","AAPL|1D"],
                ["Google","GOOGL|1D"],
                ["Microsoft","MSFT|1D"],
                ["Bitcoin","BITSTAMP:BTCUSD|1D"],
                ["Tesla","NASDAQ:TSLA|1D"],
                ["McDonald's","NYSE:MCD|1D"]
              ],
              "chartOnly": false,
              "width": "100%",
              "height": "100%",
              "locale": "en",
              "colorTheme": "dark",
              "autosize": true,
              "showVolume": false,
              "showMA": false,
              "hideDateRanges": false,
              "hideMarketStatus": false,
              "hideSymbolLogo": false,
              "scalePosition": "right",
              "scaleMode": "Normal",
              "fontFamily": "Outfit, -apple-system, sans-serif",
              "fontSize": "10",
              "noTimeScale": false,
              "valuesTracking": "1",
              "changeMode": "price-and-percent",
              "chartType": "area",
              "lineWidth": 2,
              "lineType": 0
            }
            </script>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- ── Name prompt overlay (first visit) ── -->
  <div class="overlay" id="name-overlay">
    <div class="modal">
      <div class="modal-hdr">
        <div class="modal-title">Welcome to  Bookmarks</div>
      </div>
      <p class="modal-sub">What should we call you? We'll save your name for future visits.</p>
      <input class="mfield" id="name-input" type="text" placeholder="Your name" maxlength="40" autocomplete="given-name">
      <button class="mbtn" id="name-save">Let's go →</button>
    </div>
  </div>

  <!-- ── Edit bookmark overlay ── -->
  <div class="overlay" id="edit-overlay">
    <div class="modal">
      <div class="modal-hdr">
        <div class="modal-title">Edit Bookmark</div>
        <button class="modal-x" id="edit-close" aria-label="Close">✕</button>
      </div>
      <div style="display:flex;justify-content:center;margin-bottom:10px;">
        <label for="edit-icon-upload" id="edit-icon-preview" style="width:64px;height:64px;border:1px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:0.68rem;overflow:hidden;">Upload icon</label>
        <input id="edit-icon-upload" type="file" accept="image/*" style="display:none;">
      </div>
      <input class="mfield" id="edit-name" type="text" placeholder="Bookmark name" maxlength="40">
      <input class="mfield" id="edit-url" type="url" placeholder="Bookmark URL">
      <button class="mbtn" id="edit-move-up">Move up</button>
      <button class="mbtn" id="edit-move-down">Move down</button>
      <button class="mbtn" id="edit-delete" style="background:#ef4444;color:#fff;">Delete</button>
      <button class="mbtn" id="edit-save">Save changes</button>
      <button class="mbtn" id="edit-cancel" style="background:#334155;color:#fff;">Cancel</button>
    </div>
  </div>

  <div class="overlay" id="profile-overlay">
    <div class="modal">
      <div class="modal-hdr">
        <div class="modal-title">New Profile</div>
        <button class="modal-x" id="profile-close" aria-label="Close">✕</button>
      </div>
      <input class="mfield" id="profile-name" type="text" placeholder="Profile name (e.g. Work)">
      <input class="mfield" id="profile-emoji" type="text" placeholder="Emoji icon (e.g. 💼)" maxlength="2">
      <button class="mbtn" id="profile-save">Create profile</button>
    </div>
  </div>

  <!-- ── Settings overlay ── -->
  <div class="overlay" id="settings-overlay">
    <div class="modal">
      <div class="modal-hdr">
        <div class="modal-title">Settings</div>
        <button class="modal-x" id="settings-close" aria-label="Close">✕</button>
      </div>
      <div class="settings-row"><label>Theme</label><select id="theme-select" class="mfield"><option value="dark">Midnight</option><option value="dusk">Dusk</option><option value="forest">Forest</option><option value="ocean">Ocean</option></select></div>
      <div class="settings-row"><label>Bookmark style</label><select id="style-select" class="mfield"><option value="rounded">Rounded</option><option value="square">Square</option><option value="tab">Tab</option><option value="pill">Pill</option></select></div>
      <div class="settings-row"><label>Search engine</label><select id="search-engine" class="mfield"><option value="google">Google</option><option value="bing">Bing</option><option value="duckduckgo">DuckDuckGo</option><option value="startpage">Startpage</option></select></div>
      <div class="settings-row"><label>Theme</label><select id="theme-select" class="mfield"><option value="dark">Dark</option><option value="light">Light</option></select></div>
      <div class="settings-row"><label>Bookmark style</label><select id="style-select" class="mfield"><option value="rounded">Rounded</option><option value="square">Square</option><option value="tab">Tab</option><option value="pill">Pill</option></select></div>
      <div class="settings-row"><label>Show Weather Widget</label><input id="show-weather" type="checkbox"></div>
      <div class="settings-row"><label>Show Stocks Widget</label><input id="show-stocks" type="checkbox" checked></div>
      <button class="mbtn" id="save-settings">Save settings</button>
    </div>
  </div>

  <!-- ── Add bookmark overlay ── -->
  <div class="overlay" id="bm-overlay">
    <div class="modal">
      <div class="modal-hdr">
        <div class="modal-title">Add Bookmark</div>
        <button class="modal-x" id="bm-close" aria-label="Close">✕</button>
      </div>
      <input class="mfield" id="bm-name" type="text" placeholder="Name  (e.g. GitHub)" maxlength="40" autocomplete="off">
      <input class="mfield" id="bm-url"  type="url"  placeholder="URL  (e.g. https://github.com)" autocomplete="off">
      <div style="display:flex;justify-content:center;margin-bottom:10px;">
        <label for="bm-icon-upload" id="bm-icon-preview" style="width:64px;height:64px;border:1px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:0.68rem;overflow:hidden;">Optional icon</label>
        <input id="bm-icon-upload" type="file" accept="image/*" style="display:none;">
      </div>
      <button class="mbtn" id="bm-add">Add Bookmark</button>
    </div>
  </div>

  <script>
  /* ================================================================
      Bookmarks — Production JS
     All localStorage keys:
       _name       → user's display name (string)
       _bm_v3      → bookmarks JSON array
  ================================================================ */

  // ── Utils ────────────────────────────────────────────────────────

  function lsGet(key) {
    try { return localStorage.getItem(key); } catch(e) { return null; }
  }

  function lsSet(key, val) {
    try { localStorage.setItem(key, val); } catch(e) {}
  }
  function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + (days*24*60*60*1000));
    document.cookie = name + '=' + encodeURIComponent(value) + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
  }
  function getCookie(name) {
    const key = name + '=';
    const parts = document.cookie.split(';');
    for (let p of parts) {
      p = p.trim();
      if (p.indexOf(key) === 0) return decodeURIComponent(p.substring(key.length));
    }
    return '';
  }

  function normaliseUrl(raw) {
    raw = (raw || '').trim();
    if (!raw) return '';
    if (/^https?:\/\//i.test(raw)) return raw;
    return 'https://' + raw;
  }

  function getOrigin(url) {
    try { return new URL(url).origin; } catch(e) { return null; }
  }

  // ── Name / greeting ──────────────────────────────────────────────

  const NAME_KEY = '_name';

  function getGreeting() {
    const h = new Date().getHours();
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  }

  function applyName(name) {
    document.getElementById('uname-display').textContent = name || 'there';
    // update greeting word too (in case called outside clock tick)
    const greetEl = document.getElementById('header-greeting');
    // rebuild text node before the <span>
    greetEl.childNodes[0].textContent = getGreeting() + ', ';
  }

  // Show name-prompt on first visit (no saved name)
  const nameOverlay = document.getElementById('name-overlay');
  const nameInput   = document.getElementById('name-input');
  const nameSave    = document.getElementById('name-save');

  function initName() {
    const saved = lsGet(NAME_KEY);
    if (saved) {
      applyName(saved);
    } else {
      nameOverlay.classList.add('open');
      nameInput.focus();
    }
  }

  function saveName() {
    const val = nameInput.value.trim();
    if (!val) { nameInput.focus(); return; }
    lsSet(NAME_KEY, val);
    applyName(val);
    nameOverlay.classList.remove('open');
  }

  nameSave.addEventListener('click', saveName);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });

  // ── Clock (every second) ─────────────────────────────────────────

  function tickClock() {
    const now = new Date();
    // update greeting word in case hour boundary crossed
    const greetEl = document.getElementById('header-greeting');
    if (greetEl.childNodes.length) {
      greetEl.childNodes[0].textContent = getGreeting() + ', ';
    }
    document.getElementById('clock').textContent =
      now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  tickClock();
  setInterval(tickClock, 1000);

  // ── Bookmarks data ───────────────────────────────────────────────

  const PROFILES_KEY = '_bm_profiles_v1';
  const ACTIVE_PROFILE_KEY = '_bm_active_profile_v1';
  const BM_KEY = '_bm_v3';
  const SETTINGS_KEY = '_bm_settings_v1';

  const DEFAULTS = [
    { name: 'TyCo',           url: 'https://tycoinnovations.github.io/' },
    { name: 'Google',         url: 'https://www.google.com' },
    { name: 'YouTube',        url: 'https://www.youtube.com' },
    { name: 'GitHub',         url: 'https://github.com' },
    { name: 'ChatGPT',        url: 'https://chat.openai.com' },
    { name: 'Netflix',        url: 'https://www.netflix.com' },
    { name: 'Amazon',         url: 'https://www.amazon.com' },
    { name: 'Spotify',        url: 'https://www.spotify.com' },
    { name: 'Outlook',        url: 'https://outlook.live.com' },
    { name: 'MSN',            url: 'https://www.msn.com' },
    { name: 'Canva',          url: 'https://www.canva.com' },
    { name: 'Zoom',           url: 'https://zoom.us' },
    { name: 'Creative Cloud', url: 'https://www.adobe.com/creativecloud.html' },
    { name: 'M365',           url: 'https://www.office.com' },
  ];

  function makeDefaultProfile(name, emoji) {
    return {
      name: name || 'Default',
      emoji: emoji || '📚',
      bookmarks: DEFAULTS.map(b => ({ ...b })),
      icons: {},
      settings: { theme: 'dark', bookmarkStyle: 'rounded', showWeather: true, showStocks: true, searchEngine: 'google' }
    };
  }
  function loadProfiles() {
    try {
      const raw = lsGet(PROFILES_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && Object.keys(parsed).length) return parsed;
      }
    } catch(e) {}
    return { default: makeDefaultProfile('Personal', '🏠') };
  }
  let profiles = loadProfiles();
  let activeProfileId = lsGet(ACTIVE_PROFILE_KEY) || Object.keys(profiles)[0] || 'default';
  if (!profiles[activeProfileId]) activeProfileId = Object.keys(profiles)[0];
  function currentProfile() { return profiles[activeProfileId]; }
  function persistProfiles() {
    lsSet(PROFILES_KEY, JSON.stringify(profiles));
    lsSet(ACTIVE_PROFILE_KEY, activeProfileId);
  }
  let bookmarks = (currentProfile().bookmarks || DEFAULTS.map(b => ({ ...b }))).map(b => ({...b}));
  let editingIndex = -1;
  let dragIndex = -1;
  const defaultSettings = { theme: 'dark', bookmarkStyle: 'rounded', showWeather: true, showStocks: true, searchEngine: 'google' };
  let isEditMode = false;
  let bookmarkIcons = { ...(currentProfile().icons || {}) };
  let settings = { ...defaultSettings, ...(currentProfile().settings || {}) };
  function saveBM() { currentProfile().bookmarks = bookmarks.map(b => ({...b})); persistProfiles(); }
  function saveIcons() { currentProfile().icons = { ...bookmarkIcons }; persistProfiles(); }
  function saveSettings() { currentProfile().settings = { ...settings }; persistProfiles(); }
  function applyProfile() {
    bookmarks = (currentProfile().bookmarks || DEFAULTS.map(b => ({ ...b }))).map(b => ({...b}));
    bookmarkIcons = { ...(currentProfile().icons || {}) };
    settings = { ...defaultSettings, ...(currentProfile().settings || {}) };
    applyTheme();
    applyWidgetVisibility();
    renderBM();
    const sw = document.getElementById('profile-switch');
    if (sw) sw.value = activeProfileId;
  }
  function renderProfiles() {
    const sw = document.getElementById('profile-switch');
    sw.innerHTML = Object.entries(profiles).map(([id,p]) => `<option value="${id}">${(p.emoji||'📚')} ${p.name}</option>`).join('');
    sw.value = activeProfileId;
  }
  function applyTheme() {
    const t = {
      dark:    { bg:'#0d0f14', surface:'#141720', s2:'#1c2030', text:'#e8eaf0', muted:'#6b7385', border:'rgba(255,255,255,0.07)' },
      dusk:    { bg:'#12131c', surface:'#1a1d2b', s2:'#23283a', text:'#e8ebff', muted:'#939aba', border:'rgba(179,166,255,0.16)' },
      forest:  { bg:'#0f1615', surface:'#162321', s2:'#1f2f2c', text:'#e8f3ef', muted:'#89a49d', border:'rgba(99,179,147,0.2)' },
      ocean:   { bg:'#0f1724', surface:'#152238', s2:'#1d2d47', text:'#e5efff', muted:'#8ea4c8', border:'rgba(120,168,255,0.2)' }
    }[settings.theme] || null;
    if (!t) return;
    document.documentElement.style.setProperty('--bg', t.bg);
    document.documentElement.style.setProperty('--surface', t.surface);
    document.documentElement.style.setProperty('--s2', t.s2);
    document.documentElement.style.setProperty('--text', t.text);
    document.documentElement.style.setProperty('--muted', t.muted);
    document.documentElement.style.setProperty('--border', t.border);
    document.body.style.background = `radial-gradient(1200px 700px at 10% 0%, rgba(62,207,116,0.08), transparent 55%), radial-gradient(1200px 700px at 100% 100%, rgba(59,130,246,0.09), transparent 55%), ${t.bg}`;
  }

  let bookmarks = loadBM();
  let editingIndex = -1;
  let dragIndex = -1;
  const ICON_KEY = '_bm_icons_v1';
  const defaultSettings = { theme: 'dark', bookmarkStyle: 'rounded', showWeather: true, showStocks: true, searchEngine: 'google' };
  const ICON_KEY = '_bm_icons_v1';
  const defaultSettings = { theme: 'dark', bookmarkStyle: 'rounded', showWeather: true, showStocks: true };
  let isEditMode = false;
  function loadIcons() {
    try {
      const raw = lsGet(ICON_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch(e) { return {}; }
  }
  let bookmarkIcons = loadIcons();
  function saveIcons() { lsSet(ICON_KEY, JSON.stringify(bookmarkIcons)); }
  function loadSettings() {
    try {
      const raw = lsGet(SETTINGS_KEY);
      if (!raw) return { ...defaultSettings };
      return { ...defaultSettings, ...JSON.parse(raw) };
    } catch (e) { return { ...defaultSettings }; }
  }
  let settings = loadSettings();
  function saveSettings() { lsSet(SETTINGS_KEY, JSON.stringify(settings)); }
  function applyTheme() {
    const t = {
      dark:    { bg:'#0d0f14', surface:'#141720', s2:'#1c2030', text:'#e8eaf0', muted:'#6b7385', border:'rgba(255,255,255,0.07)' },
      dusk:    { bg:'#12131c', surface:'#1a1d2b', s2:'#23283a', text:'#e8ebff', muted:'#939aba', border:'rgba(179,166,255,0.16)' },
      forest:  { bg:'#0f1615', surface:'#162321', s2:'#1f2f2c', text:'#e8f3ef', muted:'#89a49d', border:'rgba(99,179,147,0.2)' },
      ocean:   { bg:'#0f1724', surface:'#152238', s2:'#1d2d47', text:'#e5efff', muted:'#8ea4c8', border:'rgba(120,168,255,0.2)' }
    }[settings.theme] || null;
    if (!t) return;
    document.documentElement.style.setProperty('--bg', t.bg);
    document.documentElement.style.setProperty('--surface', t.surface);
    document.documentElement.style.setProperty('--s2', t.s2);
    document.documentElement.style.setProperty('--text', t.text);
    document.documentElement.style.setProperty('--muted', t.muted);
    document.documentElement.style.setProperty('--border', t.border);
    document.body.style.background = `radial-gradient(1200px 700px at 10% 0%, rgba(62,207,116,0.08), transparent 55%), radial-gradient(1200px 700px at 100% 100%, rgba(59,130,246,0.09), transparent 55%), ${t.bg}`;
    if (settings.theme === 'light') {
      document.documentElement.style.setProperty('--bg', '#f4f6fc');
      document.documentElement.style.setProperty('--surface', '#ffffff');
      document.documentElement.style.setProperty('--s2', '#eef2ff');
      document.documentElement.style.setProperty('--text', '#171a24');
      document.documentElement.style.setProperty('--muted', '#56607a');
      document.documentElement.style.setProperty('--border', 'rgba(0,0,0,0.09)');
    }
  }

  // ── Favicon ──────────────────────────────────────────────────────

  function makeFallback() {
    const d = document.createElement('div');
    d.className = 'bm-fallback';
    d.textContent = '?';
    d.setAttribute('aria-hidden', 'true');
    return d;
  }

  function createIcon(url) {
    const wrap = document.createElement('div');
    wrap.className = 'bm-icon';

    const origin = getOrigin(url);
    if (!origin) { wrap.appendChild(makeFallback()); return wrap; }

    // Google favicon service: reliable, CORS-safe, returns 16×16 blank if missing
    const customIcon = bookmarkIcons[url];
    const img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.src = customIcon || ('https://www.google.com/s2/favicons?domain=' + encodeURIComponent(origin) + '&sz=64');

    img.onload = function() {
      if (customIcon) return;
      // 16px or smaller → Google sent the blank placeholder; try direct favicon.ico
      if (this.naturalWidth <= 16) {
        const img2 = document.createElement('img');
        img2.alt = '';
        img2.loading = 'lazy';
        img2.src = origin + '/favicon.ico';
        img2.onload = function() {
          if (this.naturalWidth > 1) {
            img2.className = img.className;
            wrap.innerHTML = '';
            wrap.appendChild(img2);
          } else {
            wrap.innerHTML = '';
            wrap.appendChild(makeFallback());
          }
        };
        img2.onerror = function() {
          wrap.innerHTML = '';
          wrap.appendChild(makeFallback());
        };
      }
    };

    img.onerror = function() {
      wrap.innerHTML = '';
      wrap.appendChild(makeFallback());
    };

    wrap.appendChild(img);
    return wrap;
  }

  // ── Render bookmarks ─────────────────────────────────────────────

  function renderBM() {
    const grid = document.getElementById('bm-grid');
    grid.innerHTML = '';

    bookmarks.forEach(function(bm, i) {
      const a = document.createElement('a');
      a.href = bm.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'bookmark style-' + settings.bookmarkStyle;
      a.setAttribute('aria-label', bm.name);
      if (isEditMode) {
        a.addEventListener('click', function(e) { e.preventDefault(); });
      }

      const label = document.createElement('span');
      label.className = 'bm-label';
      label.textContent = bm.name;

      const del = document.createElement('button');
      del.className = 'tile-action tile-delete';
      del.textContent = '✕';
      del.title = 'Remove ' + bm.name;
      del.setAttribute('aria-label', 'Remove ' + bm.name);
      del.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        bookmarks.splice(i, 1);
        saveBM();
        renderBM();
      });
      const edit = document.createElement('button');
      edit.className = 'tile-action tile-edit';
      edit.textContent = '✎';
      edit.title = 'Edit ' + bm.name;
      edit.addEventListener('click', function(e) {
        e.preventDefault(); e.stopPropagation();
        openEditModal(i);
      });
      const up = document.createElement('button');
      up.className = 'tile-action tile-move';
      up.textContent = '↕';
      up.title = 'Enable drag to move';
      up.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        dragIndex = (dragIndex === i) ? -1 : i;
        renderBM();
      });
      if (isEditMode) a.classList.add('edit-mode');
      if (dragIndex === i) {
        a.classList.add('drag-ready');
        a.setAttribute('draggable', 'true');
      } else {
        a.removeAttribute('draggable');
      }
      a.addEventListener('dragstart', function(e) {
        if (dragIndex !== i) { e.preventDefault(); return; }
        a.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(i));
      });
      a.addEventListener('dragend', function() { a.classList.remove('dragging'); });
      a.addEventListener('dragover', function(e) {
        if (dragIndex < 0 || dragIndex === i) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });
      a.addEventListener('drop', function(e) {
        if (dragIndex < 0) return;
        e.preventDefault();
        const from = dragIndex;
        const to = i;
        if (from === to) return;
        const moved = bookmarks.splice(from, 1)[0];
        bookmarks.splice(to, 0, moved);
        dragIndex = to;
        saveBM();
        renderBM();
      });
      up.title = 'Move bookmark';
      up.addEventListener('click', function(e) {
        e.preventDefault(); e.stopPropagation(); openEditModal(i);
      });
      if (isEditMode) a.classList.add('edit-mode');

      a.appendChild(createIcon(bm.url));
      a.appendChild(label);
      a.appendChild(del);
      a.appendChild(edit);
      a.appendChild(up);
      grid.appendChild(a);
    });

    // add tile
    const tile = document.createElement('button');
    tile.className = 'add-tile';
    tile.setAttribute('aria-label', 'Add bookmark');
    tile.innerHTML = '<span class="plus">+</span><span>Add</span>';
    tile.addEventListener('click', openBmModal);
    grid.appendChild(tile);
  }

  // ── Add-bookmark modal ───────────────────────────────────────────

  const bmOverlay = document.getElementById('bm-overlay');
  const bmClose   = document.getElementById('bm-close');
  const bmNameEl  = document.getElementById('bm-name');
  const bmUrlEl   = document.getElementById('bm-url');
  const bmAdd     = document.getElementById('bm-add');
  const bmIconUpload = document.getElementById('bm-icon-upload');
  const bmIconPreview = document.getElementById('bm-icon-preview');
  let newIconData = '';

  function openBmModal() {
    bmNameEl.value = '';
    bmUrlEl.value  = '';
    newIconData = '';
    bmIconUpload.value = '';
    bmIconPreview.innerHTML = 'Optional icon';
    bmOverlay.classList.add('open');
    bmNameEl.focus();
  }

  function closeBmModal() {
    bmOverlay.classList.remove('open');
  }

  bmClose.addEventListener('click', closeBmModal);

  bmOverlay.addEventListener('click', function(e) {
    if (e.target === bmOverlay) closeBmModal();
  });

  bmAdd.addEventListener('click', function() {
    const name = bmNameEl.value.trim();
    const url  = normaliseUrl(bmUrlEl.value);
    if (!name || !url) {
      if (!name) bmNameEl.focus();
      else bmUrlEl.focus();
      return;
    }
    bookmarks.push({ name, url });
    if (newIconData) {
      bookmarkIcons[url] = newIconData;
      saveIcons();
    }
    saveBM();
    renderBM();
    closeBmModal();
  });

  // Enter key on URL field submits
  bmUrlEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') bmAdd.click();
  });
  // Enter key on name field moves to URL
  bmNameEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') bmUrlEl.focus();
  });
  bmIconUpload.addEventListener('change', function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
      newIconData = String(reader.result || '');
      bmIconPreview.innerHTML = '<img src="' + newIconData + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
    };
    reader.readAsDataURL(file);
  });

  const editOverlay = document.getElementById('edit-overlay');
  const editClose = document.getElementById('edit-close');
  const editName = document.getElementById('edit-name');
  const editUrl = document.getElementById('edit-url');
  const editIconUpload = document.getElementById('edit-icon-upload');
  const editIconPreview = document.getElementById('edit-icon-preview');
  let editIconData = '';
  document.getElementById('edit-save').addEventListener('click', function() {
    const name = editName.value.trim();
    const url = normaliseUrl(editUrl.value);
    if (!name || !url || editingIndex < 0) return;
    const previousUrl = bookmarks[editingIndex].url;
    bookmarks[editingIndex] = { name, url };
    if (editIconData) bookmarkIcons[url] = editIconData;
    if (previousUrl !== url && bookmarkIcons[previousUrl] && !bookmarkIcons[url]) {
      bookmarkIcons[url] = bookmarkIcons[previousUrl];
      delete bookmarkIcons[previousUrl];
    }
    saveIcons();
    saveBM(); renderBM();
    editOverlay.classList.remove('open');
  });
  function openEditModal(i) {
    editingIndex = i;
    editName.value = bookmarks[i].name;
    editUrl.value = bookmarks[i].url;
    editIconData = bookmarkIcons[bookmarks[i].url] || '';
    editIconPreview.innerHTML = editIconData ? '<img src="' + editIconData + '" alt="" style="width:100%;height:100%;object-fit:cover;">' : 'Upload icon';
    editOverlay.classList.add('open');
  }
  function closeEditModal() { editOverlay.classList.remove('open'); }
  editClose.addEventListener('click', closeEditModal);
  document.getElementById('edit-cancel').addEventListener('click', closeEditModal);
  document.getElementById('edit-delete').addEventListener('click', function() {
    if (editingIndex < 0) return;
    const url = bookmarks[editingIndex].url;
    bookmarks.splice(editingIndex, 1);
    delete bookmarkIcons[url];
    saveIcons(); saveBM(); renderBM(); closeEditModal();
  });
  document.getElementById('edit-move-up').addEventListener('click', function() {
    if (editingIndex <= 0) return;
    [bookmarks[editingIndex - 1], bookmarks[editingIndex]] = [bookmarks[editingIndex], bookmarks[editingIndex - 1]];
    editingIndex--; saveBM(); renderBM(); openEditModal(editingIndex);
  });
  document.getElementById('edit-move-down').addEventListener('click', function() {
    if (editingIndex < 0 || editingIndex >= bookmarks.length - 1) return;
    [bookmarks[editingIndex + 1], bookmarks[editingIndex]] = [bookmarks[editingIndex], bookmarks[editingIndex + 1]];
    editingIndex++; saveBM(); renderBM(); openEditModal(editingIndex);
  });
  editIconUpload.addEventListener('change', function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
      editIconData = String(reader.result || '');
      editIconPreview.innerHTML = '<img src="' + editIconData + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
    };
    reader.readAsDataURL(file);
  });
  editOverlay.addEventListener('click', e => { if (e.target === editOverlay) closeEditModal(); });

  const editOverlay = document.getElementById('edit-overlay');
  const editClose = document.getElementById('edit-close');
  const editName = document.getElementById('edit-name');
  const editUrl = document.getElementById('edit-url');
  const editIconUpload = document.getElementById('edit-icon-upload');
  const editIconPreview = document.getElementById('edit-icon-preview');
  let editIconData = '';
  document.getElementById('edit-save').addEventListener('click', function() {
    const name = editName.value.trim();
    const url = normaliseUrl(editUrl.value);
    if (!name || !url || editingIndex < 0) return;
    const previousUrl = bookmarks[editingIndex].url;
    bookmarks[editingIndex] = { name, url };
    if (editIconData) bookmarkIcons[url] = editIconData;
    if (previousUrl !== url && bookmarkIcons[previousUrl] && !bookmarkIcons[url]) {
      bookmarkIcons[url] = bookmarkIcons[previousUrl];
      delete bookmarkIcons[previousUrl];
    }
    saveIcons();
    saveBM(); renderBM();
    editOverlay.classList.remove('open');
  });
  function openEditModal(i) {
    editingIndex = i;
    editName.value = bookmarks[i].name;
    editUrl.value = bookmarks[i].url;
    editIconData = bookmarkIcons[bookmarks[i].url] || '';
    editIconPreview.innerHTML = editIconData ? '<img src="' + editIconData + '" alt="" style="width:100%;height:100%;object-fit:cover;">' : 'Upload icon';
    editOverlay.classList.add('open');
  }
  function closeEditModal() { editOverlay.classList.remove('open'); }
  editClose.addEventListener('click', closeEditModal);
  document.getElementById('edit-cancel').addEventListener('click', closeEditModal);
  document.getElementById('edit-delete').addEventListener('click', function() {
    if (editingIndex < 0) return;
    const url = bookmarks[editingIndex].url;
    bookmarks.splice(editingIndex, 1);
    delete bookmarkIcons[url];
    saveIcons(); saveBM(); renderBM(); closeEditModal();
  });
  editIconUpload.addEventListener('change', function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
      editIconData = String(reader.result || '');
      editIconPreview.innerHTML = '<img src="' + editIconData + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
    };
    reader.readAsDataURL(file);
  });
  editOverlay.addEventListener('click', e => { if (e.target === editOverlay) closeEditModal(); });

  // ── Search ───────────────────────────────────────────────────────

  function searchFor(q) {
    if (!q) return;
    const engines = {
      google: 'https://www.google.com/search?q=',
      bing: 'https://www.bing.com/search?q=',
      duckduckgo: 'https://duckduckgo.com/?q=',
      startpage: 'https://www.startpage.com/do/search?q='
    };
    const base = engines[settings.searchEngine] || engines.google;
    window.open(base + encodeURIComponent(q), '_blank', 'noopener,noreferrer');
  }

  // tag buttons
  document.querySelectorAll('.stag').forEach(function(btn) {
    btn.addEventListener('click', function() {
      searchFor(this.dataset.q);
    });
  });

  const searchInput = document.getElementById('search-input');
  const suggestEl   = document.getElementById('suggestions');

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const q = searchInput.value.trim();
      if (q) { searchFor(q); searchInput.value = ''; suggestEl.style.display = 'none'; }
    }
    if (e.key === 'Escape') {
      suggestEl.style.display = 'none';
      suggestEl.innerHTML = '';
    }
  });

  const SUGGESTIONS = [
    'Weather today', 'News headlines', 'Trending topics',
    'Popular searches', 'Tech news', 'Local events', 'Entertainment'
  ];

  searchInput.addEventListener('input', function() {
    const v = this.value.trim().toLowerCase();
    if (!v) { suggestEl.style.display = 'none'; suggestEl.innerHTML = ''; return; }
    const hits = SUGGESTIONS.filter(s => s.toLowerCase().includes(v));
    if (!hits.length) { suggestEl.style.display = 'none'; suggestEl.innerHTML = ''; return; }
    suggestEl.style.display = 'block';
    suggestEl.innerHTML = hits.map(function(s) {
      return '<div class="sug-item" role="option" tabindex="0">🔍 ' +
        s.replace(/</g, '&lt;') + '</div>';
    }).join('');
    suggestEl.querySelectorAll('.sug-item').forEach(function(el) {
      el.addEventListener('click', function() {
        searchFor(el.textContent.replace('🔍 ', '').trim());
        searchInput.value = '';
        suggestEl.style.display = 'none';
        suggestEl.innerHTML = '';
      });
    });
  });

  // close suggestions when clicking outside
  document.addEventListener('click', function(e) {
    if (!searchInput.contains(e.target) && !suggestEl.contains(e.target)) {
      suggestEl.style.display = 'none';
    }
  });

  const settingsOverlay = document.getElementById('settings-overlay');
  document.getElementById('open-settings').addEventListener('click', function() {
    document.getElementById('theme-select').value = settings.theme;
    document.getElementById('style-select').value = settings.bookmarkStyle;
    document.getElementById('search-engine').value = settings.searchEngine || 'google';
    document.getElementById('show-weather').checked = settings.showWeather;
    document.getElementById('show-stocks').checked = settings.showStocks;
    settingsOverlay.classList.add('open');
  });
  document.getElementById('settings-close').addEventListener('click', () => settingsOverlay.classList.remove('open'));
  document.getElementById('save-settings').addEventListener('click', function() {
    settings.theme = document.getElementById('theme-select').value;
    settings.bookmarkStyle = document.getElementById('style-select').value;
    settings.searchEngine = document.getElementById('search-engine').value;
    settings.showWeather = document.getElementById('show-weather').checked;
    settings.showStocks = document.getElementById('show-stocks').checked;
    setCookie('tyco_search_engine', settings.searchEngine, 365);
    saveSettings();
    applyTheme();
    applyWidgetVisibility();
    renderBM();
    settingsOverlay.classList.remove('open');
  });
  document.getElementById('toggle-edit').addEventListener('click', function() {
    isEditMode = !isEditMode;
    if (!isEditMode) dragIndex = -1;
    settings.showWeather = document.getElementById('show-weather').checked;
    settings.showStocks = document.getElementById('show-stocks').checked;
    saveSettings();
    document.getElementById('wbox-weather').style.display = settings.showWeather ? '' : 'none';
    document.getElementById('wbox-stocks').style.display = settings.showStocks ? '' : 'none';
    location.reload();
  });
  document.getElementById('toggle-edit').addEventListener('click', function() {
    isEditMode = !isEditMode;
    this.textContent = isEditMode ? 'Done' : 'Edit';
    renderBM();
  });

  // ── Kick off ─────────────────────────────────────────────────────
  function applyWidgetVisibility() {
    const weather = document.getElementById('wbox-weather');
    const stocks = document.getElementById('wbox-stocks');
    const widgetsCard = document.getElementById('widgets-card');
    weather.style.display = settings.showWeather ? '' : 'none';
    stocks.style.display = settings.showStocks ? '' : 'none';
    widgetsCard.style.display = (!settings.showWeather && !settings.showStocks) ? 'none' : 'flex';
  }
  const cookieSearchEngine = getCookie('tyco_search_engine');
  if (cookieSearchEngine && ['google','bing','duckduckgo','startpage'].includes(cookieSearchEngine)) {
    settings.searchEngine = cookieSearchEngine;
  } else if (!settings.searchEngine) {
    settings.searchEngine = 'google';
  }
  if (!['dark','dusk','forest','ocean'].includes(settings.theme)) settings.theme = 'dark';
  if (!['rounded','square','tab','pill'].includes(settings.bookmarkStyle)) settings.bookmarkStyle = 'rounded';
  renderProfiles();
  document.getElementById('profile-switch').addEventListener('change', function() {
    activeProfileId = this.value;
    applyProfile();
  });
  const profileOverlay = document.getElementById('profile-overlay');
  document.getElementById('new-profile').addEventListener('click', function() {
    document.getElementById('profile-name').value = '';
    document.getElementById('profile-emoji').value = '';
    profileOverlay.classList.add('open');
  });
  document.getElementById('profile-close').addEventListener('click', () => profileOverlay.classList.remove('open'));
  document.getElementById('profile-save').addEventListener('click', function() {
    const name = document.getElementById('profile-name').value.trim();
    const emoji = document.getElementById('profile-emoji').value.trim() || '📚';
    if (!name) return;
    const id = 'p_' + Date.now().toString(36);
    profiles[id] = makeDefaultProfile(name, emoji);
    activeProfileId = id;
    persistProfiles();
    renderProfiles();
    applyProfile();
    profileOverlay.classList.remove('open');
  });
  applyTheme();
  applyWidgetVisibility();
  applyTheme();
  applyWidgetVisibility();
  applyTheme();
  document.getElementById('wbox-weather').style.display = settings.showWeather ? '' : 'none';
  document.getElementById('wbox-stocks').style.display = settings.showStocks ? '' : 'none';
  renderBM();
  initName();
  </script>
</body>
</html>
